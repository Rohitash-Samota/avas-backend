name: avas-backend

services:
  backend:
    build: .
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-avas-new}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      DB_USERNAME: ${MYSQL_USER:-avas}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MONGODB_URI: mongodb://${MONGO_USERNAME:-avas}:${MONGO_PASSWORD:?Set MONGO_PASSWORD}@mongo:27017/${MONGO_DATABASE:-avas-new}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COMMERCE_TEST_MODE: ${COMMERCE_TEST_MODE:-true}
      AVAS_BOOTSTRAP_ADMIN_ENABLED: ${AVAS_BOOTSTRAP_ADMIN_ENABLED:-false}
      AVAS_BOOTSTRAP_ADMIN_USERNAME: ${AVAS_BOOTSTRAP_ADMIN_USERNAME:-platform.admin}
      AVAS_BOOTSTRAP_ADMIN_EMAIL: ${AVAS_BOOTSTRAP_ADMIN_EMAIL:-}
      AVAS_BOOTSTRAP_ADMIN_MOBILE: ${AVAS_BOOTSTRAP_ADMIN_MOBILE:-}
      AVAS_BOOTSTRAP_ADMIN_PASSWORD: ${AVAS_BOOTSTRAP_ADMIN_PASSWORD:-}
      AVAS_BOOTSTRAP_ADMIN_TENANT_ID: ${AVAS_BOOTSTRAP_ADMIN_TENANT_ID:-tenant-production}
      # The AI service runs on the host during local development, so the container reaches it
      # through the host gateway rather than its own loopback. Both readings stay optional: the
      # platform keeps its deterministic path whenever the service is unreachable or unkeyed.
      AVAS_AI_ENABLED: ${AVAS_AI_ENABLED:-true}
      AVAS_AI_BASE_URL: ${AVAS_AI_BASE_URL:-http://host.docker.internal:8090}
      AVAS_AI_SERVICE_KEY: ${AVAS_AI_SERVICE_KEY:-}
      AVAS_AI_OUTLINE_ENABLED: ${AVAS_AI_OUTLINE_ENABLED:-true}
      # A generated picture of a concept, shown beside the measured plan and never instead of it.
      # Needs AVAS_AI_DRAWING_PROVIDER=flux on the AI service too; without it this route answers
      # 204 and the UI shows the measured plan alone, which is what it would have shown anyway.
      AVAS_AI_RENDER_ENABLED: ${AVAS_AI_RENDER_ENABLED:-false}
      # Generous for local development on purpose: the first render after the AI service restarts
      # loads tens of gigabytes of weights before it draws anything, and this client is the shorter
      # of the two ceilings in practice.
      AVAS_AI_RENDER_TIMEOUT_SECONDS: ${AVAS_AI_RENDER_TIMEOUT_SECONDS:-600}
    ports:
      - "8080:8080"
    extra_hosts:
      # Docker Desktop resolves this name already; declaring it keeps Linux hosts working too.
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-avas-new}
      MYSQL_USER: ${MYSQL_USER:-avas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-avas}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host localhost --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  mongo_data:
