debug: false

spring:
  application:
    name: avas-backend
  datasource:
    # Local defaults intentionally target the persistent AVAS Docker MySQL instance on 3307.
    # Production must override these values with managed secrets.
    url: ${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/avas-new?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}}
    username: ${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:avas}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:avas_local}}
    hikari:
      pool-name: avas-mysql-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  data:
    mongodb:
      # Homebrew MongoDB is the local default and currently runs without authentication.
      # Docker and production supply an authenticated MONGODB_URI.
      uri: ${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27017/avas-new}}
      auto-index-creation: ${MONGO_AUTO_INDEX:true}
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    path: ${LOG_PATH:./logs}
  level:
    org.springframework.web: ${WEB_LOG_LEVEL:INFO}
    org.hibernate: ${HIBERNATE_LOG_LEVEL:WARN}

avas:
  identity:
    # The product specification makes SQL the system of record for users, roles and sessions.
    # The Mongo identity adapter remains only for compatibility with earlier local snapshots.
    store: ${IDENTITY_STORE:sql}
  mongo:
    enabled: ${MONGO_ENABLED:true}
  auth:
    issuer: avas-backend
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:30}
    jwt-secret: ${JWT_SECRET:}
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    google:
      enabled: ${GOOGLE_OAUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  commerce:
    test-mode: ${COMMERCE_TEST_MODE:true}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      api-url: ${RAZORPAY_API_URL:https://api.razorpay.com/v1}
  ai:
    enabled: ${AVAS_AI_ENABLED:false}
    base-url: ${AVAS_AI_BASE_URL:http://127.0.0.1:8090}
    service-key: ${AVAS_AI_SERVICE_KEY:}
    # A reasoning model composing three complete room programmes takes longer than a plain
    # completion, and this was the shorter of the two ceilings: every call was abandoned here at 25
    # seconds and answered from deterministic rules, which reads exactly like a model that was never
    # configured. Generation is synchronous, so this is also the longest a customer waits before the
    # deterministic programme answers instead — lower it if that matters more than reaching a model.
    timeout-seconds: ${AVAS_AI_TIMEOUT_SECONDS:90}
    # Reading a plot drawing uploads the file itself, so it is enabled separately from parameter
    # optimization and is given the longer timeout an image or PDF reading needs.
    outline-enabled: ${AVAS_AI_OUTLINE_ENABLED:false}
    outline-timeout-seconds: ${AVAS_AI_OUTLINE_TIMEOUT_SECONDS:45}
    # Where the rooms go, as opposed to which rooms there are. Enabling this hands the arrangement
    # to AVAS AI, which plans an open hub — the entrance opening into the living-dining run, every
    # room taking its door off it — instead of the double-loaded corridor `FloorPlanner` draws.
    # Disabled here, the platform plans locally and every storey still carries a corridor.
    #
    # Enabled separately from parameter optimization because it costs differently: one call per
    # strategy, so three per generation, each carrying the whole programme and returning every room
    # on every storey. A layout that fails to arrive, fails to validate, or comes back with a
    # corridor in it is refused and the local planner draws that option instead, so the customer
    # always gets three concepts.
    layout-enabled: ${AVAS_AI_LAYOUT_ENABLED:true}
    # Longer than the programme budget: this is the largest reply the service produces, and on a
    # reasoning model the thinking is drawn from the same ceiling before the first room is emitted.
    layout-timeout-seconds: ${AVAS_AI_LAYOUT_TIMEOUT_SECONDS:120}
    # A generated picture of a concept, shown beside the measured plan and never instead of it.
    #
    # Off by default and deliberately a separate switch from every other AI route, because it is the
    # only one whose answer is not adopted: nothing here is validated, costed or drawn from. A
    # diffusion model asked for an architectural drawing does not decline — it returns convincing
    # linework over invented dimensions — so the platform keeps drawing its own plan and this buys
    # the customer a look at the house, labelled as an illustration wherever it is shown.
    #
    # Disabled, `GET /drawings/{id}/render` answers 204 and the UI shows the plan alone.
    render-enabled: ${AVAS_AI_RENDER_ENABLED:false}
    # Far longer than the other budgets. A diffusion model on a cold pipeline spends its first call
    # loading tens of gigabytes of weights, and every call after that is seconds rather than
    # milliseconds. Nothing waits on it: the plan is already on screen when the picture arrives.
    render-timeout-seconds: ${AVAS_AI_RENDER_TIMEOUT_SECONDS:180}
  bootstrap-admin:
    enabled: ${AVAS_BOOTSTRAP_ADMIN_ENABLED:false}
    first-name: ${AVAS_BOOTSTRAP_ADMIN_FIRST_NAME:Platform}
    last-name: ${AVAS_BOOTSTRAP_ADMIN_LAST_NAME:Administrator}
    username: ${AVAS_BOOTSTRAP_ADMIN_USERNAME:platform.admin}
    email: ${AVAS_BOOTSTRAP_ADMIN_EMAIL:}
    mobile-number: ${AVAS_BOOTSTRAP_ADMIN_MOBILE:}
    password: ${AVAS_BOOTSTRAP_ADMIN_PASSWORD:}
    tenant-id: ${AVAS_BOOTSTRAP_ADMIN_TENANT_ID:tenant-production}
  versions:
    rules: RJ-JDA-2026.08
    knowledge: AVAS-KB-2026.08
    strategy: layout-parameters-2.0.0
    estimate-policy: governed-takeoff-2.0.0
